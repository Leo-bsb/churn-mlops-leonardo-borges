[project]
name = "churn"
version = "0.1.0"
description = "Previsão de churn — projeto-fio-condutor do curso de MLOps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<3",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandera>=0.20",
    "mlflow>=3.16.1",
    "pyyaml>=6.0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "dvc>=3.0",
    "pyarrow>=15",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
